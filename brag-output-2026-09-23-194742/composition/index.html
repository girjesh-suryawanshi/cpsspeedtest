<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>CpsSpeedTest Brag Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');

      body {
        margin: 0;
        background: hsl(222.2, 84%, 4.9%);
        color: hsl(210, 40%, 98%);
        font-family: 'Inter', system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      /* Scene 1: Challenge */
      .challenge-word {
        font-size: 140px;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0 15px;
        display: inline-block;
      }
      .highlight {
        color: hsl(172.2, 91.2%, 59.8%); /* Neon Teal */
        text-shadow: 0 0 40px hsl(172.2, 91.2%, 59.8%, 0.5);
      }

      /* Scene 2: Gauge */
      .gauge-container {
        position: relative;
        width: 800px;
        height: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .gauge-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .gauge-track {
        stroke: hsl(210, 40%, 96.1%, 0.1);
        stroke-width: 12;
        fill: none;
        stroke-linecap: round;
      }
      .gauge-fill {
        stroke: hsl(217.2, 91.2%, 59.8%); /* Electric Blue */
        stroke-width: 12;
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 628;
        stroke-dashoffset: 628; /* starts empty */
        filter: drop-shadow(0 0 20px hsl(217.2, 91.2%, 59.8%, 0.6));
      }
      .needle {
        stroke: white;
        stroke-width: 8;
        stroke-linecap: round;
        transform-origin: 400px 450px;
      }
      .cps-text {
        position: absolute;
        bottom: 0;
        font-size: 120px;
        font-weight: 900;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .cps-label {
        font-size: 32px;
        font-weight: 700;
        color: hsl(215.4, 16.3%, 46.9%);
        letter-spacing: 4px;
        margin-top: 10px;
      }

      /* Scene 3: Games */
      .games-grid {
        display: flex;
        gap: 40px;
      }
      .game-card {
        background: rgba(255,255,255,0.05);
        border: 2px solid rgba(255,255,255,0.1);
        border-radius: 24px;
        padding: 40px;
        width: 320px;
        text-align: left;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      .game-icon {
        width: 80px;
        height: 80px;
        background: rgba(59, 130, 246, 0.2);
        border-radius: 20px;
        margin-bottom: 24px;
      }
      .game-title {
        font-size: 36px;
        font-weight: 800;
        margin: 0 0 10px 0;
      }
      .game-desc {
        font-size: 20px;
        color: hsl(215.4, 16.3%, 46.9%);
        margin: 0;
      }

      /* Scene 4: Outro */
      .rank-card {
        background: linear-gradient(135deg, rgba(20, 184, 166, 0.2), transparent);
        border: 3px solid hsl(172.2, 91.2%, 59.8%);
        border-radius: 40px;
        padding: 60px 100px;
        text-align: center;
        margin-bottom: 60px;
        box-shadow: 0 0 80px hsl(172.2, 91.2%, 59.8%, 0.3);
      }
      .rank-icon { font-size: 100px; margin-bottom: 20px; }
      .rank-title { font-size: 64px; font-weight: 900; margin: 0; }
      .rank-cps { font-size: 36px; color: hsl(172.2, 91.2%, 59.8%); font-weight: 800; margin: 10px 0 0 0; }
      
      .outro-text {
        font-size: 100px;
        font-weight: 900;
        text-shadow: 0 0 40px rgba(255,255,255,0.3);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-i9zw" id="root" data-composition-id="brag-cpsspeedtest" data-width="1920" data-height="1080" data-duration="18">
      
      <!-- Audio Assets -->
      <audio data-hf-id="hf-fy91" id="bgm" src="assets/bgm.mp3" data-start="0"></audio>
      <audio data-hf-id="hf-00uv" id="click1" src="assets/click.wav" data-start="3"></audio>

      <!-- Scene 1: The Challenge (0-3s) -->
      <section data-hf-id="hf-26x5" id="scene-1" class="clip" data-start="0" data-duration="3">
        <div data-hf-id="hf-pih3" style="display:flex; flex-wrap:wrap; justify-content:center; max-width: 1400px;">
          <span data-hf-id="hf-h9ch" class="challenge-word">How</span>
          <span data-hf-id="hf-au17" class="challenge-word">fast</span>
          <span data-hf-id="hf-cdgh" class="challenge-word">can</span>
          <span data-hf-id="hf-erxc" class="challenge-word">you</span>
          <span data-hf-id="hf-4df0" class="challenge-word highlight">CLICK?</span>
        </div>
      </section>

      <!-- Scene 2: The Gauge (3-8s) -->
      <section data-hf-id="hf-ip45" id="scene-2" class="clip" data-start="3" data-duration="5">
        <div data-hf-id="hf-ciks" class="gauge-container" id="gauge-container">
          <svg data-hf-id="hf-eq8z" class="gauge-svg" viewBox="0 0 800 500">
            <path data-hf-id="hf-wzod" class="gauge-track" d="M 100 450 A 300 300 0 0 1 700 450" />
            <path data-hf-id="hf-32ug" class="gauge-fill" id="gauge-fill" d="M 100 450 A 300 300 0 0 1 700 450" />
            <line data-hf-id="hf-zxsw" class="needle" id="gauge-needle" x1="400" y1="450" x2="200" y2="200" />
          </svg>
          <div data-hf-id="hf-6lt4" class="cps-text" id="cps-value">0.0</div>
          <div data-hf-id="hf-fmbz" class="cps-label">CPS</div>
        </div>
      </section>

      <!-- Scene 3: The Games (8-13s) -->
      <section data-hf-id="hf-q9gl" id="scene-3" class="clip" data-start="8" data-duration="5">
        <div data-hf-id="hf-wlhi" class="games-grid">
          <div data-hf-id="hf-2l7b" class="game-card" id="card-1">
            <div data-hf-id="hf-qn8g" class="game-icon"></div>
            <h3 data-hf-id="hf-coxo" class="game-title">Time Guesser</h3>
            <p data-hf-id="hf-0qq6" class="game-desc">Stop exactly at 10s.</p>
          </div>
          <div data-hf-id="hf-txbg" class="game-card" id="card-2">
            <div data-hf-id="hf-hkpk" class="game-icon"></div>
            <h3 data-hf-id="hf-tgjd" class="game-title">Aim Trainer</h3>
            <p data-hf-id="hf-yc7y" class="game-desc">Sharpen precision.</p>
          </div>
          <div data-hf-id="hf-uoz9" class="game-card" id="card-3">
            <div data-hf-id="hf-gdsh" class="game-icon"></div>
            <h3 data-hf-id="hf-tihw" class="game-title">Speed Typer</h3>
            <p data-hf-id="hf-d5l8" class="game-desc">30s typing sprint.</p>
          </div>
        </div>
      </section>

      <!-- Scene 4: Outro (13-18s) -->
      <section data-hf-id="hf-f26c" id="scene-4" class="clip" data-start="13" data-duration="5">
        <div data-hf-id="hf-j3oo" class="rank-card" id="rank-card">
          <div data-hf-id="hf-w0qn" class="rank-icon">🐆</div>
          <p data-hf-id="hf-3f7u" class="rank-title">Cheetah</p>
          <p data-hf-id="hf-4otl" class="rank-cps">7–10 CPS</p>
        </div>
        <div data-hf-id="hf-i345" class="outro-text" id="outro-text">Compete Globally.</div>
      </section>

    </div>
    
    <script>
      // The single registered timeline
      const tl = gsap.timeline({ paused: true });

      // Scene 1: Challenge
      tl.from(".challenge-word", {
        scale: 2,
        opacity: 0,
        duration: 0.2,
        stagger: 0.3,
        ease: "power4.out"
      }, 0);
      tl.to("#scene-1", { scale: 1.1, opacity: 0, duration: 0.3 }, 2.7);

      // Scene 2: Gauge
      tl.fromTo("#gauge-container", 
        { scale: 0.8, opacity: 0 }, 
        { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 
        3
      );
      
      // Animate gauge fill (stroke-dashoffset from 628 down to ~150)
      tl.fromTo("#gauge-fill",
        { strokeDashoffset: 628 },
        { strokeDashoffset: 150, duration: 3.5, ease: "power2.out" },
        3.5
      );
      
      // Animate needle rotation
      tl.fromTo("#gauge-needle",
        { rotation: -90 },
        { rotation: 45, duration: 3.5, ease: "power2.out" },
        3.5
      );

      // Animate numbers
      const counterObj = { val: 0 };
      tl.to(counterObj, {
        val: 14.2,
        duration: 3.5,
        ease: "power2.out",
        onUpdate: function() {
          document.getElementById("cps-value").innerText = counterObj.val.toFixed(1);
        }
      }, 3.5);

      tl.to("#scene-2", { y: -100, opacity: 0, duration: 0.4, ease: "power2.in" }, 7.6);

      // Scene 3: Games
      tl.fromTo(".game-card", 
        { y: 150, opacity: 0, rotationX: 45 },
        { y: 0, opacity: 1, rotationX: 0, duration: 0.6, stagger: 0.4, ease: "back.out(1.2)" },
        8
      );
      tl.to("#scene-3", { scale: 0.9, opacity: 0, duration: 0.4 }, 12.6);

      // Scene 4: Outro
      tl.fromTo("#rank-card",
        { scale: 0.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "elastic.out(1, 0.7)" },
        13.2
      );
      tl.fromTo("#outro-text",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        14.5
      );

      // Register the timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["brag-cpsspeedtest"] = tl;
    </script>
  </body>
</html>
